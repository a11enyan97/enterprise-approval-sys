services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: approval-sys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-1234}
      POSTGRES_DB: ${DATABASE_NAME:-approvalsys}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Next.js 全栈应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: approval-sys-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 数据库（容器内使用服务名 db，端口 5432）
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-1234}@db:5432/${DATABASE_NAME:-approvalsys}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-1234}
      DATABASE_NAME: ${DATABASE_NAME:-approvalsys}
      # 阿里云 OSS（本地无 OSS 时可留空，上传功能会报错但不影响其他功能）
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
